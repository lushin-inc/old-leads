<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top 5 — Customer Plans</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --stable:#21245C; --fresh:#00ADED;
    --gray:#EDEDED; --line:#DCDCDC; --soft:#6B6B6B; --ink:#1F1F1F;
  }
  *{box-sizing:border-box}
  body{margin:0; padding:38px 20px 80px; background:#F7F8FA; color:var(--ink);
    font-family:'Poppins',Arial,sans-serif; font-size:15px; line-height:1.45}
  .wrap{max-width:900px; margin:0 auto}
  h1{font-size:19px; font-weight:500; color:var(--stable); margin:0}
  .rule{height:3px; background:var(--fresh); border-radius:2px; margin:14px 0 20px}

  .card{background:#fff; border-radius:12px; margin-bottom:12px; overflow:hidden;
    box-shadow:0 1px 8px rgba(33,36,92,.07)}
  .top{display:flex; align-items:center; gap:14px; padding:20px 22px; cursor:pointer; user-select:none}
  .top:hover{background:#FAFBFC}
  .num{color:var(--fresh); font-weight:600; font-size:15px; width:22px; flex:0 0 auto}
  .name{flex:1; font-weight:500; font-size:16px; color:var(--stable)}
  .name.empty{color:#AAB0BC; font-weight:400}
  .caret{color:#B6BCC8; font-size:13px; transition:transform .18s}
  .card.open .caret{transform:rotate(90deg)}

  .body{display:none; padding:4px 22px 24px}
  .card.open .body{display:block}

  .row{display:grid; grid-template-columns:1fr; gap:18px; margin-bottom:22px}
  .f label{display:block; font-size:11.5px; font-weight:500; color:var(--soft); margin-bottom:5px}
  .f input{width:100%; border:none; border-bottom:1.5px solid var(--line); background:transparent;
    font-family:inherit; font-size:15px; color:var(--ink); padding:7px 2px}
  .f input:focus{outline:none; border-bottom-color:var(--fresh)}

  .blk{margin-bottom:20px}
  .blk > label{display:block; font-size:14.5px; font-weight:500; color:var(--stable); margin-bottom:9px}
  textarea{width:100%; border:1.5px solid var(--line); border-radius:8px; background:transparent;
    font-family:inherit; font-size:15px; color:var(--ink); padding:11px 13px; resize:vertical;
    min-height:76px; line-height:1.6}
  textarea:focus{outline:none; border-color:var(--fresh)}

  .dl{display:block; width:100%; margin-top:30px; border:none; border-radius:999px; cursor:pointer;
    font-family:inherit; color:#fff; font-size:19px; font-weight:600; padding:26px; letter-spacing:.2px;
    background:linear-gradient(135deg,#21245C,#00ADED);
    box-shadow:0 8px 26px rgba(0,173,237,.32); transition:.18s}
  .dl:hover{transform:translateY(-1px); box-shadow:0 12px 30px rgba(0,173,237,.42)}
  .dl:active{transform:translateY(0)}

  @media(max-width:700px){
    body{padding:20px 12px 60px}
    .row{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">

  <h1>Top 5 — Customer Plans</h1>
  <div class="rule"></div>

  <div id="cards"></div>

  <button class="dl" id="dl">Download Word Doc</button>
</div>

<script>
const BOXES = [["care", "What they care about"],
               ["holding", "What’s holding it up"],
               ["next", "What needs to happen next"]];
const COUNT = 5;
const KEY = "lushin.top5CustomerPlans.v1";

let state = { customers: [] };
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "null");
  if (saved && saved.customers) state = saved;
} catch (e) {}
while (state.customers.length < COUNT) state.customers.push({});
state.customers = state.customers.slice(0, COUNT);

function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

const cards = document.getElementById("cards");

state.customers.forEach((a, i) => {
  const card = el("div", "card");

  const top = el("div", "top");
  top.appendChild(el("div", "num", String(i + 1)));
  const name = el("div", "name empty", "Customer " + (i + 1));
  top.appendChild(name);
  const caret = el("div", "caret");
  caret.innerHTML = "&#9656;";
  top.appendChild(caret);
  top.addEventListener("click", () => card.classList.toggle("open"));
  card.appendChild(top);

  const body = el("div", "body");

  const row1 = el("div", "row");
  const text = (labelText, key) => {
    const f = el("div", "f");
    f.appendChild(el("label", null, labelText));
    const input = document.createElement("input");
    input.value = a[key] || "";
    input.addEventListener("input", () => { a[key] = input.value; save(); paint(); });
    f.appendChild(input);
    return f;
  };
  row1.appendChild(text("Customer name", "customer"));
  body.appendChild(row1);

  BOXES.forEach(([key, labelText]) => {
    const blk = el("div", "blk");
    blk.appendChild(el("label", null, labelText));
    const ta = document.createElement("textarea");
    ta.value = a[key] || "";
    ta.addEventListener("input", () => { a[key] = ta.value; save(); });
    blk.appendChild(ta);
    body.appendChild(blk);
  });

  card.appendChild(body);
  cards.appendChild(card);

  function paint() {
    const has = (a.customer || "").trim();
    name.textContent = has || "Customer " + (i + 1);
    name.className = "name" + (has ? "" : " empty");
  }
  paint();
});

/* ==================== zip writer (no libraries) ==================== */
const CRC = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(buf) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zip(files) {
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  files.forEach(f => {
    const name = enc.encode(f.name);
    const data = enc.encode(f.data);
    const crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true); lh.setUint16(6, 0, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, 0, true); lh.setUint16(12, 0x21, true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);

    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true);
    cd.setUint16(4, 20, true); cd.setUint16(6, 20, true);
    cd.setUint16(8, 0, true); cd.setUint16(10, 0, true);
    cd.setUint16(12, 0, true); cd.setUint16(14, 0x21, true);
    cd.setUint32(16, crc, true);
    cd.setUint32(20, data.length, true); cd.setUint32(24, data.length, true);
    cd.setUint16(28, name.length, true);
    cd.setUint16(30, 0, true); cd.setUint16(32, 0, true);
    cd.setUint16(34, 0, true); cd.setUint16(36, 0, true);
    cd.setUint32(38, 0, true); cd.setUint32(42, offset, true);
    central.push(new Uint8Array(cd.buffer), name);
    offset += 30 + name.length + data.length;
  });
  let cdSize = 0;
  central.forEach(p => cdSize += p.length);
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true);
  eo.setUint16(4, 0, true); eo.setUint16(6, 0, true);
  eo.setUint16(8, files.length, true); eo.setUint16(10, files.length, true);
  eo.setUint32(12, cdSize, true); eo.setUint32(16, offset, true);
  eo.setUint16(20, 0, true);
  return new Blob([...parts, ...central, new Uint8Array(eo.buffer)],
    { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
}

/* ==================== wordprocessingml ==================== */
const STABLE = "21245C", FRESH = "00ADED", LINEC = "BFBFBF", SOFTC = "666666";
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function run(text, o) {
  o = o || {};
  return '<w:r><w:rPr><w:rFonts w:ascii="Poppins" w:hAnsi="Poppins" w:cs="Poppins"/>'
    + '<w:sz w:val="' + (o.size || 20) + '"/><w:szCs w:val="' + (o.size || 20) + '"/>'
    + '<w:color w:val="' + (o.color || "333333") + '"/>' + (o.bold ? "<w:b/>" : "")
    + '</w:rPr><w:t xml:space="preserve">' + esc(text) + '</w:t></w:r>';
}
function para(runs, o) {
  o = o || {};
  let pr = "<w:pPr>";
  if (o.keepNext) pr += "<w:keepNext/>";
  if (o.rule) pr += '<w:pBdr><w:bottom w:val="single" w:sz="' + (o.ruleSize || 4)
    + '" w:space="3" w:color="' + (o.ruleColor || LINEC) + '"/></w:pBdr>';
  pr += '<w:spacing w:before="' + (o.before || 0) + '" w:after="' + (o.after || 0)
    + '" w:line="260" w:lineRule="auto"/></w:pPr>';
  return "<w:p>" + pr + (Array.isArray(runs) ? runs.join("") : runs) + "</w:p>";
}
function label(text) {
  return para(run(text, { size: 16, color: SOFTC, bold: true }),
    { before: 170, after: 30, keepNext: true });
}
function answer(text) {
  const lines = String(text || "").split(/\r?\n/).filter(l => l.trim() !== "");
  if (!lines.length) return para(run("—", { size: 20, color: "999999" }), { after: 20 });
  return lines.map(l => para(run(l, { size: 20, color: "1F1F1F" }), { after: 40 })).join("");
}
function cell(text, w, o) {
  o = o || {};
  return '<w:tc><w:tcPr><w:tcW w:w="' + w + '" w:type="dxa"/>'
    + "<w:tcBorders>" + ["top", "left", "bottom", "right"].map(s =>
        '<w:' + s + ' w:val="single" w:sz="4" w:space="0" w:color="'
        + (o.head ? STABLE : LINEC) + '"/>').join("") + "</w:tcBorders>"
    + (o.fill ? '<w:shd w:val="clear" w:color="auto" w:fill="' + o.fill + '"/>' : "")
    + '<w:tcMar><w:top w:w="60" w:type="dxa"/><w:left w:w="100" w:type="dxa"/>'
    + '<w:bottom w:w="60" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tcMar>'
    + '<w:vAlign w:val="center"/></w:tcPr>'
    + para(run(text, { size: o.size || 18, color: o.color || "1F1F1F", bold: !!o.bold })) + "</w:tc>";
}
function pageBreak() {
  return '<w:p><w:pPr><w:spacing w:after="0"/></w:pPr>'
    + '<w:r><w:br w:type="page"/></w:r></w:p>';
}
function actionSection(list) {
  const items = [];
  list.forEach((a, i) => {
    const who = (a.customer || "").trim() || "Customer " + (i + 1);
    String(a.next || "").split(/\r?\n/).forEach(line => {
      if (line.trim() !== "") items.push([who, line.trim()]);
    });
  });
  if (!items.length) return "";

  const W = [500, 3300, 6568];
  const out = [pageBreak()];
  out.push(para(run("Action items", { size: 28, color: STABLE, bold: true })));
  out.push(para(run(""), { before: 60, after: 200, rule: true, ruleSize: 12, ruleColor: FRESH }));

  const rows = ['<w:tr><w:trPr><w:tblHeader/><w:trHeight w:val="300" w:hRule="atLeast"/></w:trPr>'
    + [cell("", W[0], { head: true, fill: STABLE }),
       cell("Customer", W[1], { head: true, fill: STABLE, color: "FFFFFF", bold: true, size: 15 }),
       cell("What needs to happen next", W[2], { head: true, fill: STABLE, color: "FFFFFF", bold: true, size: 15 })
      ].join("") + "</w:tr>"];

  let last = null;
  items.forEach(([who, action]) => {
    const label = who === last ? "" : who;
    last = who;
    rows.push('<w:tr><w:trPr><w:trHeight w:val="340" w:hRule="atLeast"/></w:trPr>'
      + [cell("☐", W[0], { size: 22, color: "888888" }),
         cell(label, W[1], { bold: !!label, color: label ? STABLE : "FFFFFF" }),
         cell(action, W[2])].join("") + "</w:tr>");
  });

  out.push('<w:tbl><w:tblPr><w:tblW w:w="10368" w:type="dxa"/><w:tblLayout w:type="fixed"/></w:tblPr>'
    + "<w:tblGrid>" + W.map(w => '<w:gridCol w:w="' + w + '"/>').join("") + "</w:tblGrid>"
    + rows.join("") + "</w:tbl>");
  return out.join("");
}

function buildDocumentXml() {
  const body = [];
  body.push(para(run("Top 5 — Customer Plans", { size: 28, color: STABLE, bold: true })));
  body.push(para(run(""), { before: 60, after: 200, rule: true, ruleSize: 12, ruleColor: FRESH }));

  const live = state.customers.filter(a => (a.customer || "").trim());
  const list = live.length ? live : state.customers;

  list.forEach((a, i) => {
    if (i > 0) body.push(para(run(""), { before: 240, after: 200, rule: true, ruleColor: "DDDDDD" }));
    body.push(para([run((i + 1) + "   ", { size: 22, color: FRESH, bold: true }),
                    run(a.customer || "Customer " + (i + 1), { size: 22, color: STABLE, bold: true })],
                   { after: 110, keepNext: true }));
    BOXES.forEach(([key, labelText]) => {
      body.push(label(labelText));
      body.push(answer(a[key]));
    });
  });

  body.push(actionSection(list));

  body.push('<w:sectPr><w:pgSz w:w="12240" w:h="15840"/>'
    + '<w:pgMar w:top="1080" w:right="936" w:bottom="1080" w:left="936" '
    + 'w:header="0" w:footer="0" w:gutter="0"/></w:sectPr>');

  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
    + "<w:body>" + body.join("") + "</w:body></w:document>";
}

const CONTENT_TYPES = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
  + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
  + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
  + '<Default Extension="xml" ContentType="application/xml"/>'
  + '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'
  + '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>'
  + "</Types>";
const RELS = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
  + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
  + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>'
  + "</Relationships>";
const DOC_RELS = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
  + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
  + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
  + "</Relationships>";
const STYLES = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
  + '<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
  + "<w:docDefaults><w:rPrDefault><w:rPr>"
  + '<w:rFonts w:ascii="Poppins" w:hAnsi="Poppins" w:cs="Poppins"/>'
  + '<w:sz w:val="20"/><w:szCs w:val="20"/><w:color w:val="333333"/>'
  + "</w:rPr></w:rPrDefault><w:pPrDefault><w:pPr>"
  + '<w:spacing w:after="0" w:line="260" w:lineRule="auto"/>'
  + "</w:pPr></w:pPrDefault></w:docDefaults>"
  + '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>'
  + "</w:styles>";

document.getElementById("dl").addEventListener("click", () => {
  const blob = zip([
    { name: "[Content_Types].xml", data: CONTENT_TYPES },
    { name: "_rels/.rels", data: RELS },
    { name: "word/_rels/document.xml.rels", data: DOC_RELS },
    { name: "word/styles.xml", data: STYLES },
    { name: "word/document.xml", data: buildDocumentXml() }
  ]);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "Top 5 Customer Plans.docx";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1200);
});
</script>
</body>
</html>
